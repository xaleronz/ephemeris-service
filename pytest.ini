[pytest]
# Put the service root on sys.path so `import main` / `import ephemeris` resolve
# regardless of how pytest is invoked. Bare `pytest` (as CI runs it) does not add
# the CWD; only `python -m pytest` does — so without this the CI collection fails
# with ModuleNotFoundError even though a local `python -m pytest` passes.
pythonpath = .
testpaths = tests
